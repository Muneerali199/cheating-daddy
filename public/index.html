<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cheating Daddy - AI-powered assistant for interviews, meetings, and coding sessions">
    <meta name="theme-color" content="#050816">
    <title>Cheating Daddy - AI Assistant Dashboard</title>
    <link rel="stylesheet" href="/app.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050816;
        }
        
        #root {
            width: 100%;
            height: 100%;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050816;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        #loading.loaded {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(99, 102, 241, 0.1);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script src="/app.js"></script>
    <script>
        // Hide loading screen once React loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('loaded');
            }, 300);
        });
    </script>
</body>
</html>
